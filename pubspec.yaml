name: habit_tracker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  adhan_dart: ^2.0.1
  audioplayers: ^6.8.1
  clock: ^1.1.2
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  file_picker: ">=12.0.0-beta.1 <13.0.0"
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_dynamic_icon: ^2.1.0
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  hijri: ^3.0.0
  home_widget: ^0.9.3
  http: ^1.2.0
  in_app_purchase: ^3.2.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  logger: ^2.7.0
  meta: ^1.18.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.10.0
  pointycastle: ^4.0.0
  printing: ^5.12.0
  quick_actions: ^1.1.0
  riverpod_annotation: ^4.0.3
  screen_protector: ^1.4.2
  share_plus: ^13.2.1
  sqlite3: ^3.4.0
  timezone: ^0.11.1
  url_launcher: ^6.2.0
  uuid: ^4.6.0
  # Android-only periodic top-up of the notification scheduling window
  # (`strategies/notifications.md`) — not used on iOS, see
  # core/notifications/notification_workmanager.dart.
  workmanager: ^0.9.0+3

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  # Pinned exact, not ^3.2.5: the latest *stable* freezed (3.2.5) caps
  # analyzer <11, but drift_dev/riverpod_generator both need analyzer
  # ^12 — 3.2.6-dev.1 is the only version bridging that gap right now.
  # Revisit once a stable freezed ships against analyzer 12+.
  freezed: 3.2.6-dev.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/prayer_cities.json
    - assets/sounds/dose_done_chime.mp3
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#006874"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26

flutter_native_splash:
  color: "#006874"
  image: assets/splash/splash_logo.png
  color_dark: "#00363A"
  image_dark: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo.png
    icon_background_color: "#006874"
    image_dark: assets/splash/splash_logo.png
    icon_background_color_dark: "#00363A"
  android: true
  ios: true
  web: false
