name: habit_tracker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  adhan_dart: ^2.0.1
  clock: ^1.1.2
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  intl: ^0.20.2
  logger: ^2.7.0
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  riverpod_annotation: ^4.0.3
  sqlite3: ^3.4.0
  timezone: ^0.11.1
  uuid: ^4.6.0
  # Android-only periodic top-up of the notification scheduling window
  # (`strategies/notifications.md`) — not used on iOS, see
  # core/notifications/notification_workmanager.dart.
  workmanager: ^0.9.0+3

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  # Pinned exact, not ^3.2.5: the latest *stable* freezed (3.2.5) caps
  # analyzer <11, but drift_dev/riverpod_generator both need analyzer
  # ^12 — 3.2.6-dev.1 is the only version bridging that gap right now.
  # Revisit once a stable freezed ships against analyzer 12+.
  freezed: 3.2.6-dev.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/prayer_cities.json
